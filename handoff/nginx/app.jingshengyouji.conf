# app.jingshengyouji.com —— 境内网页端(顾客页 / /admin / /platform / /sign)→ Railway
#
# 🔴 照 api.jingshengyouji.conf 同款写(11p §三)。**官网 jingshengyouji.conf 一个字不碰**(J-110)。
# 🔴 与 api 那份的差别只有两处,其余逐行相同:
#    ① 这一份是**给人打开的网页**,所以白名单里多了 /(首页)、/web、/assets、/admin、/sign、/bind;
#    ② 🔴 **/platform 仍然不转** —— 平台运维后台不该挂在商家域名下。
#       店主用 /platform 时走原域名(www.luckyluxeatelier.com/platform)。
#
# 名单从后端路由定义量出来(不是凭记忆);不在名单里的一律 404 并记进单独日志 ——
# 这样「漏转」是一行看得见的日志,而不是一个静默坏掉的页面。

server {
    server_name app.jingshengyouji.com;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log;

    client_max_body_size 12m;   # 签署文件/小记图片走 data: 直传,给足

    # 首页(顾客端入口,带 ?store= 专属链接)
    location = / {
        proxy_pass https://www.luckyluxeatelier.com/;
        proxy_set_header Host              www.luckyluxeatelier.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~ ^/(health|auth|my|admin|ai|stores|store|services|availability|bookings|booking-drafts|payments|settlements|sign|bind|bind-tokens|member-code|portfolio|add-ons|technicians|shops|share|users|web|assets|wechat|merchant-leads)(/|$) {
        proxy_pass https://www.luckyluxeatelier.com;
        proxy_set_header Host              www.luckyluxeatelier.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;   # 预约/结算会走 AI
        proxy_read_timeout    60s;
    }

    # 🔴 名单外(含 /platform · /sandbox · /wechat-simulator):404,并单独记一份 —— 漏转在这里看得见
    location / {
        access_log /var/log/nginx/app.unmatched.log;
        return 404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    # 证书由 certbot 签发后自动补齐下面四行(和 api 那份同一个账户):
    #   sudo certbot --nginx -d app.jingshengyouji.com
}
