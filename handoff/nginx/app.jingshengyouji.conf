# app.jingshengyouji.com —— 境内网页端(顾客页 / /admin / /platform / /sign)→ Railway
#
# 🔴 照 api.jingshengyouji.conf 同款写(11p §三)。**官网 jingshengyouji.conf 一个字不碰**(J-110)。
# 🔴 与 api 那份的差别只有两处,其余逐行相同:
#    ① 这一份是**给人打开的网页**,所以白名单里多了 /(首页)、/web、/assets、/admin、/sign、/bind;
#    ② /platform **转**(11p §三 原话:「顾客页 / /admin / /platform / /sign 都从它打开」)。
#
# ⚠️ 记一笔我自己的偏离:第一版我把 /platform 排除了,理由写成「平台运维后台不该挂在商家域名下」,
#    **而令里明写要转**。那是我自作主张改了一条权限口径,还把它写进注释让它看起来像规矩 ——
#    11q 步骤 5 实访当场 404,才把这件事照出来。**令说转就转;有顾虑写进回执让人裁,不是自己动手。**
#    (顾虑本身照记:平台后台挂在商家域名下,攻击面比只挂原域名大一点。要收窄请单独下令。)
#
# 名单从后端路由定义量出来(不是凭记忆);不在名单里的一律 404 并记进单独日志 ——
# 这样「漏转」是一行看得见的日志,而不是一个静默坏掉的页面。

upstream youji_web_railway {
    server www.luckyluxeatelier.com:443;
    keepalive 32;
}

server {
    server_name app.jingshengyouji.com;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log;

    client_max_body_size 12m;   # 签署文件/小记图片走 data: 直传,给足

    # 首页(顾客端入口,带 ?store= 专属链接)
    location = / {
        proxy_pass https://youji_web_railway/;
        proxy_set_header Host              www.luckyluxeatelier.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name www.luckyluxeatelier.com;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location ~ ^/(health|auth|my|admin|platform|ai|stores|store|services|availability|bookings|booking-drafts|payments|settlements|sign|bind|bind-tokens|member-code|portfolio|add-ons|technicians|shops|share|users|web|assets|wechat|merchant-leads)(/|$) {
        proxy_pass https://youji_web_railway;
        proxy_set_header Host              www.luckyluxeatelier.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name www.luckyluxeatelier.com;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;   # 预约/结算会走 AI
        proxy_read_timeout    60s;
    }

    # 🔴 名单外(含 /sandbox · /wechat-simulator):404,并单独记一份 —— 漏转在这里看得见
    location / {
        access_log /var/log/nginx/app.unmatched.log;
        return 404;
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    # 证书由 certbot 签发后自动补齐下面四行(和 api 那份同一个账户):
    #   sudo certbot --nginx -d app.jingshengyouji.com
}
