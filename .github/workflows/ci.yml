# Lucky Luxe CI:每次 push 自动跑全部 29 个回归套件
# 部署 job 预留:云服务器选定后取消注释并配置 secrets
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 真机 SVG 空白件(2026-08-23):签署快照/笔迹要出 PNG(真机 <image> 不认 SVG)。
      # 栅格化用系统包 librsvg(零 npm 依赖不变);CJK 字体必须装,不然 PNG 上中文变方块。
      # CI 也装 = 让「快照必须是 PNG」这条断言在 Linux 上真的跑到(与生产同构)。
      - name: Install SVG rasterizer (librsvg + CJK fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
      # 🔴 09v §二(店主批):**照脚本自己注释里写的跑法来** ——
      # `run-all-tests.sh:8-18` 有一条判据:标准输出是管道就 `exit 2`
      # (案由:它起的后台服务会攥着管道写端,那头永远等不到 EOF,看着像卡死)。
      # 而 Actions 的 `run:` 给的正是管道 ⇒ 这一步一进来就秒退 ⇒ job failure。
      # 🔴 这是 J-92 的实例,还跨了两个文件:**脚本注释里写明了正确跑法,而这里没照着做**,
      # 而且这条判据是店主 05w 亲立的 —— 它可能一直在把 CI 打红,只是 CI 24 天没跑过,没人知道。
      # 三处不许省:`set +e`(不然重定向那行红了就直接退,cat 不到)·
      # `cat` 在 `exit` 之前 · `exit $rc` 保留真实退出码不许吞。
      # 顺带把日志直接打进 Actions 输出 —— 以后不用 admin 权限去下载 job log。
      - name: Run all regression suites
        run: |
          set +e
          bash apps/api/run-all-tests.sh > ci.log 2>&1
          rc=$?
          cat ci.log
          # 🔴 09w §二(乙)(店主批,原定推后;第三次红之后它成了唯一拿得到原因的路,提前做):
          # 失败时把日志末尾**合成一条** `::error::` 注解 —— **注解是匿名可读的**
          # (`/check-runs/<id>/annotations`),而 `/logs` 要 admin(403)。
          # 🔴 两处照 09w 写死,不许省:
          #   ① **合成一条**,用 `%0A` 当换行 —— GitHub 每个 step 只显示**前 10 条** error 注解,
          #      一行一条的结果是看到中间几行、恰恰不是最后几行(这一条 09w 明确点过)。
          #   ② **不加 `bash -x`** —— 它能解决「set -euo pipefail 静默退出看不到行号」,
          #      但注解是匿名可读的,`-x` 会把每条命令连同展开后的变量打出来,
          #      等于「门守住了,却在拒绝的时候把钥匙念了一遍」。要加得先扫一遍会不会展开凭据,单独报批。
          if [ "$rc" != "0" ]; then
            # 🔴 第一版是盲取末 80 行 —— 现测被 GitHub 的注解长度上限**截断在中间**,
            # 恰好没看到失败那几行(与 09w 说的「只显示前 10 条」同一族毛病:**取错了那一段**)。
            # 改成**先取要害、再取末尾**:红行优先,其余用末 25 行补上下文。
            { echo '--- 红行(^not ok / ❌ / 未过) ---'
              grep -nE '^not ok|❌|项未过|没过' ci.log | tail -n 15
              echo '--- 末 25 行 ---'
              tail -n 25 ci.log
            } > fail.txt
            MSG=$(sed 's/%/%25/g; s/\r/ /g' fail.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=CI 失败要害::${MSG}"
          fi
          exit $rc

