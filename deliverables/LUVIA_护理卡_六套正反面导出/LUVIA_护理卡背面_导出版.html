<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LUVIA 半径｜护理卡背面三主题·初版版式修订</title>
  <style>
    @font-face {
      font-family: "Jost";
      src: url("../assets/Jost-Light.ttf") format("truetype");
      font-weight: 300;
    }
    @font-face {
      font-family: "Jost";
      src: url("../assets/Jost-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #d8d5d0; }
    body {
      color: var(--ink);
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    }
    .board {
      --paper: #f4efe8;
      --paper-2: #ece2d9;
      --ink: #493b39;
      --muted: #7b6865;
      --accent: #ad8c88;
      --accent-soft: rgba(173,140,136,.14);
      width: 1536px;
      height: 1024px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      position: relative;
      overflow: hidden;
      background-color: #ddd7d0;
      background-image: url("../assets/back_oil_01_ballet.png");
      background-size: cover;
      background-position: center;
      page-break-after: always;
    }
    .board.book {
      --paper: #f3eee4;
      --paper-2: #e7dfd2;
      --ink: #403c37;
      --muted: #6f6a62;
      --accent: #718196;
      --accent-soft: rgba(113,129,150,.13);
      background-color: #d8d1c6;
      background-image: url("../assets/back_oil_02_book.png");
    }
    .board.celadon {
      --paper: #edf1ec;
      --paper-2: #dfe8e2;
      --ink: #344742;
      --muted: #687b75;
      --accent: #718b84;
      --accent-soft: rgba(113,139,132,.14);
      background-color: #cfd9d3;
      background-image: url("../assets/back_oil_03_celadon.png");
    }
    .card {
      height: 988px;
      position: relative;
      overflow: hidden;
      padding: 36px 42px 30px;
      background: linear-gradient(105deg, rgba(255,252,247,.48), rgba(255,252,247,.27) 52%, rgba(255,252,247,.45));
      border: 1px solid rgba(77,60,54,.18);
      box-shadow: 0 8px 20px rgba(37,31,28,.10);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .34;
      background: linear-gradient(90deg, rgba(255,255,255,.38), transparent 20% 82%, rgba(255,255,255,.25));
    }
    .card::after {
      display: none;
    }
    .book .card { background-color: rgba(249,243,231,.12); }
    .celadon .card { background-color: rgba(244,249,246,.10); }
    .topline, .header, .content, .footer { position: relative; z-index: 1; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .16em;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(75,59,53,.18);
    }
    .topline .en { font: 300 12px/1 Jost, sans-serif; letter-spacing: .2em; }
    .header {
      min-height: 124px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .header h1 {
      margin: 0 0 7px;
      font-weight: 400;
      font-size: 36px;
      letter-spacing: .13em;
    }
    .header .sub {
      color: var(--accent);
      font: 300 13px/1 Jost, sans-serif;
      letter-spacing: .28em;
    }
    .logo {
      width: 180px;
      height: 102px;
      object-fit: contain;
      object-position: center;
      opacity: .92;
      flex: 0 0 auto;
    }
    .section {
      margin-top: 14px;
      padding: 16px 16px 14px;
      background: rgba(255,253,249,.44);
      border: 0;
      border-top: 1px solid rgba(75,59,53,.24);
      border-bottom: 1px solid rgba(75,59,53,.12);
    }
    .section.tools { margin-top: 13px; }
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title h2 {
      margin: 0;
      color: var(--ink);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: .12em;
    }
    .section-title span {
      color: var(--accent);
      font: 300 11px/1 Jost, sans-serif;
      letter-spacing: .22em;
    }
    ol.care {
      list-style: none;
      counter-reset: care;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 7px;
    }
    ol.care li {
      counter-increment: care;
      position: relative;
      padding-left: 34px;
      font-size: 16px;
      line-height: 1.48;
      letter-spacing: .025em;
    }
    ol.care li::before {
      content: counter(care, decimal-leading-zero);
      position: absolute;
      left: 0;
      top: 1px;
      color: var(--accent);
      font: 400 12px/1.7 Jost, sans-serif;
      letter-spacing: .05em;
    }
    .tool-list { display: grid; gap: 8px; }
    .tool {
      display: grid;
      grid-template-columns: 118px 1fr;
      gap: 12px;
      align-items: start;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(75,59,53,.15);
    }
    .tool:last-child { padding-bottom: 0; border-bottom: 0; }
    .tool strong {
      color: var(--accent);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: .06em;
    }
    .tool p {
      margin: 0;
      font-size: 15px;
      line-height: 1.48;
      letter-spacing: .015em;
    }
    .reminder {
      margin-top: 13px;
      padding: 12px 16px;
      color: var(--muted);
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: .03em;
    }
    .footer {
      position: absolute;
      left: 42px;
      right: 142px;
      bottom: 24px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding-top: 11px;
      border-top: 1px solid rgba(75,59,53,.18);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
    }
    .footer .tagline { font-size: 13px; }
    .qr-placeholder {
      position: absolute;
      z-index: 2;
      right: 44px;
      bottom: 22px;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
      background: rgba(255,253,249,.28);
      font: 300 10px/1.25 Jost, "PingFang SC", sans-serif;
      letter-spacing: .08em;
    }
    .qr-placeholder::before,
    .qr-placeholder::after,
    .qr-placeholder .corner {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      border: 2px solid currentColor;
      opacity: .72;
    }
    .qr-placeholder::before { left: 7px; top: 7px; }
    .qr-placeholder::after { right: 7px; top: 7px; }
    .qr-placeholder .corner { left: 7px; bottom: 7px; }

    /* 恢复最初护理卡背面的疏朗信息结构 */
    .card { padding: 34px 44px 28px; }
    .topline { padding-bottom: 11px; }
    .header {
      min-height: 150px;
      align-items: flex-start;
      padding-top: 28px;
    }
    .header h1 {
      margin: 0 0 10px;
      font-size: 38px;
      letter-spacing: .11em;
    }
    .header .cn-sub {
      font-size: 21px;
      letter-spacing: .12em;
      color: var(--ink);
    }
    .header .short-line {
      width: 70px;
      height: 2px;
      margin-top: 20px;
      background: var(--accent);
      opacity: .7;
    }
    .logo { width: 154px; height: 90px; margin-top: -4px; opacity: .72; }
    .section,
    .section.tools {
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
    }
    .section.tools {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid color-mix(in srgb, var(--accent) 65%, transparent);
    }
    .section-title { margin-bottom: 14px; }
    .section-title h2 { font-size: 23px; font-weight: 400; }
    ol.care { gap: 9px; }
    ol.care li {
      min-height: 36px;
      display: flex;
      align-items: center;
      padding-left: 50px;
      font-size: 16px;
      line-height: 1.46;
    }
    ol.care li::before {
      width: 32px;
      height: 32px;
      top: 1px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--ink);
      background: color-mix(in srgb, var(--accent) 38%, rgba(255,255,255,.64));
      font: 400 14px/1 Jost, sans-serif;
      letter-spacing: 0;
    }
    .tool-list { gap: 6px; }
    .tool {
      min-height: 48px;
      display: grid;
      grid-template-columns: 42px 126px 1fr;
      gap: 11px;
      align-items: center;
      padding: 0;
      border: 0;
    }
    .tool-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--ink);
    }
    .tool-icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
    .tool strong { font-size: 16px; font-weight: 400; }
    .tool p { font-size: 15px; line-height: 1.4; }
    .reminder {
      margin-top: 12px;
      padding: 9px 0 0;
      background: transparent;
      border: 0;
      font-size: 13px;
    }
    .footer { bottom: 23px; left: 44px; right: 142px; min-height: 58px; align-items: flex-end; }
  </style>
</head>
<body>
  <div class="board ballet" id="back-01" data-name="芭蕾午后">
    <article class="card nail-card"></article>
    <article class="card lash-card"></article>
  </div>

  <div class="board book" id="back-02" data-name="书页与缎带">
    <article class="card nail-card"></article>
    <article class="card lash-card"></article>
  </div>

  <div class="board celadon" id="back-03" data-name="青瓷花影">
    <article class="card nail-card"></article>
    <article class="card lash-card"></article>
  </div>

  <template id="nail-template">
    <div class="topline"><span class="en">BACK · NAIL</span></div>
    <header class="header">
      <div><h1>美甲居家护理</h1><div class="cn-sub">让美丽更持久</div><div class="short-line"></div></div>
      <img class="logo" src="../assets/LUVIA_A2_gold.svg" alt="LUVIA 半径" />
    </header>
    <main class="content">
      <section class="section">
        <div class="section-title"><h2>护理注意事项</h2><span>CARE NOTES</span></div>
        <ol class="care">
          <li>完成后 24 小时内避免长时间泡水、蒸桑拿及高温环境。</li>
          <li>日常做家务或接触清洁剂时请佩戴手套，减少化学品刺激。</li>
          <li>请勿用指甲撬、抠硬物；如有起翘或断裂，请及时联系门店处理。</li>
          <li>每日涂抹甲缘护理油 1–2 次，按摩至吸收，帮助保持甲周滋润。</li>
          <li>建议 3–4 周回店卸除或维护，避免自行强行剥落。</li>
        </ol>
      </section>
      <section class="section tools">
        <div class="section-title"><h2>护理包工具</h2><span>TOOL GUIDE</span></div>
        <div class="tool-list">
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><path d="M12 8h8v4l3 4v7a7 7 0 0 1-14 0v-7l3-4z"/><path d="M14 3h4v5"/></svg></span><strong>营养油</strong><p>滋润甲缘，每日少量涂抹并按摩至吸收。</p></div>
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><rect x="5" y="11" width="22" height="10" rx="5" transform="rotate(-32 16 16)"/><path d="M10 20l12-8"/></svg></span><strong>海绵锉</strong><p>轻柔修整边缘，勿大力来回打磨。</p></div>
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><path d="M5 24 25 8l2 2L7 26z"/><path d="m23 10 2 2"/></svg></span><strong>木质推棒</strong><p>清理边缘残留，勿深入甲沟或用力刮擦。</p></div>
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="22" rx="1"/><path d="M10 9h12M10 23h12M11 12v8M21 12v8"/></svg></span><strong>酒精棉片</strong><p>使用护理工具前后清洁工具表面。</p></div>
        </div>
      </section>
      <div class="reminder">＊工具配置以实际护理包为准</div>
    </main>
    <footer class="footer"><span class="tagline">以自己为圆心，探索更多可能的自己</span></footer>
    <div class="qr-placeholder" aria-label="二维码占位"><span class="corner"></span><span>二维码<br>占位</span></div>
  </template>

  <template id="lash-template">
    <div class="topline"><span class="en">BACK · LASH</span></div>
    <header class="header">
      <div><h1>美睫居家护理</h1><div class="cn-sub">让轻盈更持久</div><div class="short-line"></div></div>
      <img class="logo" src="../assets/LUVIA_A2_gold.svg" alt="LUVIA 半径" />
    </header>
    <main class="content">
      <section class="section">
        <div class="section-title"><h2>护理注意事项</h2><span>CARE NOTES</span></div>
        <ol class="care">
          <li>完成后 6 小时内避免沾水、蒸汽、汗蒸及高温冲洗。</li>
          <li>洁面卸妆时避免使用油性产品，请勿横向揉搓或拉扯睫毛根部。</li>
          <li>每日早晚沿睫毛生长方向轻梳，睡觉时尽量避免趴睡或压眼。</li>
          <li>请勿使用睫毛夹，也不要自行剪、扯或拔除嫁接睫毛。</li>
          <li>建议 2–3 周回店补睫；如持续刺痛、红肿或流泪，请及时联系门店。</li>
        </ol>
      </section>
      <section class="section tools">
        <div class="section-title"><h2>护理包工具</h2><span>TOOL GUIDE</span></div>
        <div class="tool-list">
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><path d="M7 25 21 11"/><path d="m18 8 6 6M20 6l6 6M22 5l5 5"/><path d="m5 27 2-2"/></svg></span><strong>睫毛梳</strong><p>每日轻梳，整理嫁接睫毛的生长方向。</p></div>
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><path d="M7 25 21 11"/><path d="M20 7c4 1 5 3 5 6-3 0-5-1-7-3z"/><path d="m5 27 2-2"/></svg></span><strong>清洁刷</strong><p>搭配温和无油洁面，轻刷根部与缝隙后冲净。</p></div>
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><path d="M6 25 24 7"/><ellipse cx="7" cy="25" rx="3" ry="2" transform="rotate(-45 7 25)"/><ellipse cx="25" cy="7" rx="3" ry="2" transform="rotate(-45 25 7)"/></svg></span><strong>棉棒</strong><p>用于局部清洁眼周，操作时避免勾扯睫毛。</p></div>
          <div class="tool"><span class="tool-icon"><svg viewBox="0 0 32 32"><rect x="7" y="17" width="8" height="10" rx="2"/><path d="M11 17V6M9 6h4M11 9l8 5M18 12l3 4"/></svg></span><strong>睫毛雨衣</strong><p>整理漫画款睫毛，帮助毛束聚拢并收尖。</p></div>
        </div>
      </section>
      <div class="reminder">＊睫毛雨衣少量用于毛尖造型，避开眼睑与胶点；工具配置以实际护理包为准</div>
    </main>
    <footer class="footer"><span class="tagline">以自己为圆心，探索更多可能的自己</span></footer>
    <div class="qr-placeholder" aria-label="二维码占位"><span class="corner"></span><span>二维码<br>占位</span></div>
  </template>

  <script>
    document.querySelectorAll(".board").forEach(board => {
      const nail = document.querySelector("#nail-template").content.cloneNode(true);
      const lash = document.querySelector("#lash-template").content.cloneNode(true);
      board.querySelector(".nail-card").appendChild(nail);
      board.querySelector(".lash-card").appendChild(lash);
    });
  </script>
</body>
</html>
