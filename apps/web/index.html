<!doctype html>
<html lang="zh-CN">
  <head>
    <script src="/web/web-scope.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约</title>
    <!-- 🔴 夜7 段2 现测出来的事故:`styles.css` 在 05z 那一轮令牌化之后,
         整份都在用 `var(--paper/--ink/--card/--line/--sub)` —— 而**这一页从来没引过令牌文件**,
         于是那些 var() 全是空的:顾客端底色透明、字色回落成纯黑,整页塌掉。
         令牌必须排在 styles.css **前面**(后者靠它取值)。 -->
    <link rel="stylesheet" href="/web/design-tokens.css?v=20260825e-w2">
    <link rel="stylesheet" href="/web/styles.css?v=20261009-gallery19">
    <link rel="stylesheet" href="/web/image-framing.css?v=20260924-images">
  </head>
  <body>
    <main class="shell web-app-shell">
      <header class="topbar">
        <a class="brand" href="/">
          <!-- 店主 08-16:左上角=平台品牌(多商家平台),与小程序同款「有迹」;店名在 hero/标签页 -->
          <span class="brand-mark"><img src="/assets/images/youji-logo.png" alt="有迹 YOUJI logo"></span>
          <span>
            <strong id="brandName">有迹</strong>
            <small>YOUJI</small>
          </span>
        </a>
        <nav class="top-actions">
          <a class="ghost-link" href="/web/privacy.html" data-privacy-link>隐私与个人信息</a>
          <button class="toggle" id="storeSwitchBtn" type="button">切换门店</button>
          <a class="ghost-link" href="/admin" data-owner-link>商家后台</a>
          <button class="toggle active" id="langZh" type="button">中文</button>
          <button class="toggle" id="langEn" type="button">EN</button>
        </nav>
      </header>

      <section id="authView" class="auth-layout"></section>

      <section id="appView" class="app-view hidden">
        <nav class="web-tabs" aria-label="门店导航">
          <button class="web-tab active" data-view="home" type="button"><span data-nav-label="home">首页</span></button>
          <button class="web-tab" data-view="services" type="button"><span data-nav-label="services">服务</span></button>
          <button class="web-tab" data-view="cart" type="button"><span data-nav-label="cart">购物车</span> <span id="cartBadge">0</span></button>
          <button class="web-tab" data-view="me" type="button"><span data-nav-label="me">我的</span></button>
        </nav>

        <div id="screen"></div>
      </section>

      <section class="ai-assistant-widget hidden" id="aiAssistantWidget" aria-live="polite"></section>
    </main>

    <div class="toast" id="toast"></div>
    <script src="/web/image-view-core.js?v=20260924-images"></script>
    <script src="/web/image-framing.js?v=20260924-images"></script>
    <script src="/web/home-image-preview.js?v=20260924-images"></script>
    <script src="/web/img-placeholder.js?v=20260924-images"></script>
    <script src="/web/snapshot-viewer.js?v=20260824c-b4"></script>
    <script src="/web/deploy-config.js?v=20260824c-b4"></script>
    <script src="/web/customer-wallet.js?v=20261002-migration-pending"></script>
    <script src="/web/placeholder-words.js?v=20260922a-ph"></script>
    <script src="/web/customer-recommend.js?v=20260902y-rec"></script>
    <script src="/web/ui-dialog.js?v=20260903a-d104"></script>
    <script src="/web/party.js?v=20260902y-rec"></script>
    <script src="/web/customer-auth-copy.js?v=20260916a-n13"></script>
    <script src="/web/customer-copy.js?v=20260916a-n13"></script>
    <script src="/web/customer-signed-docs.js?v=20260920b-signed2"></script>
    <script src="/web/customer-profile.js"></script>
    <script src="/web/portfolio-navigation.js?v=20261009-gallery19"></script>
    <script src="/web/customer.js?v=20261009-gallery19"></script>
  </body>
</html>
