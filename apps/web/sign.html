<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>服务确认单</title>
<style>
  /* 金额红线:本页**不做任何金额计算**,所有数字直接显示 /settlements/:code 的返回值。
     页面里找不到任何加减乘除 —— 这是结构性保证,不是靠自觉。 */
  :root{--gold:#c8a47e;--bronze:#9b7655;--ink:#2d2826;--paper:#fbf8f5;--soft:#f1e7df;--line:#e7ddd4;--muted:#8c8279;--danger:#a34c48;--ok:#2f7d5c}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--soft);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55}
  .wrap{max-width:460px;margin:0 auto;padding:14px 14px 120px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 10px}
  .topbar h1{font-size:16px;font-weight:750}
  .pill{font-size:12px;border-radius:999px;padding:3px 11px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .pill.warn{background:#fff5ec;border-color:#f0d8bf;color:#8a5a2b}
  .doc{background:#fff;border-radius:16px;padding:18px 16px;box-shadow:0 2px 14px rgba(45,40,38,.06);position:relative}
  .doc-head{border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:12px}
  .store{font-size:17px;font-weight:800}
  .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .sign-slot{position:absolute;top:16px;right:16px;text-align:center;width:104px}
  .sign-slot .lab{font-size:11px;color:var(--muted)}
  .sign-slot .val{font-family:"Kaiti SC","STKaiti",serif;font-size:22px;color:var(--ink);border-bottom:1px solid var(--line);min-height:30px;padding:2px 0}
  .sign-slot .val.empty{color:#cfc5ba;font-size:12px;font-family:inherit;padding-top:9px}
  .sec{margin-top:16px}
  .sec h2{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
  .row .no{color:var(--muted);font-size:12px;margin-right:6px}
  .row .amt{white-space:nowrap}
  .strike{color:var(--muted);text-decoration:line-through;font-size:12.5px;margin-right:6px}
  .free{color:var(--ok);font-weight:700;font-size:13px}
  .badge{display:inline-block;font-size:11px;background:#fff5ec;color:#8a5a2b;border:1px solid #f0d8bf;border-radius:8px;padding:1px 7px;margin-left:6px}
  .proxy-line{background:#fff5ec;border:1px solid #f0d8bf;border-radius:9px;padding:7px 10px;font-size:12.5px;color:#8a5a2b;margin-bottom:8px}
  .totals{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .totals .row{font-size:13.5px;color:var(--muted)}
  .totals .row b{color:var(--ink)}
  .totals .grand{font-size:19px;font-weight:850;color:var(--ink);padding-top:8px}
  .totals .grand span:last-child{color:var(--bronze)}
  .disc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:16px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
  .disc input{width:17px;height:17px;margin-top:2px;flex:none}
  .pad{margin-top:14px}
  .pad canvas{width:100%;height:150px;background:#fff;border:1px dashed var(--line);border-radius:12px;touch-action:none;display:block}
  .pad .hint{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  .pad .hint button{border:none;background:none;color:var(--bronze);font-size:12px;text-decoration:underline;cursor:pointer}
  .cta{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .cta .inner{max-width:460px;margin:0 auto}
  .cta button{width:100%;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:800;padding:14px;cursor:pointer}
  .cta button:disabled{background:#d6cdc4;color:#fff}
  /* 还差一步时:按钮不死灰(点得动、点了给提示),只是淡一档 + 上方常驻一行说明 */
  .cta button.waiting{background:#a8a099}
  .cta .need{font-size:12.5px;color:#a8551f;background:#fdf3ec;border-radius:9px;padding:7px 10px;margin-bottom:8px;text-align:center}
  .disc.flash{outline:2px solid var(--bronze);outline-offset:2px;border-radius:12px}
  /* 已签单右上角的真实笔迹:嵌快照本体,裁到签名那一块 */
  .sign-slot .val{overflow:hidden}
  .sign-slot .val .ink{display:block;width:100%;height:48px;object-fit:contain;object-position:left center;mix-blend-mode:multiply}
  .sign-slot .val .ink-note{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}
  .cta .foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;font-size:13px;border-radius:10px;padding:10px 18px;opacity:0;transition:.25s;z-index:99;max-width:88vw;text-align:center}
  .toast.show{opacity:1}
  .done{text-align:center;padding:30px 10px;color:var(--ok);font-weight:800}
  .err{background:#fff;border-radius:16px;padding:28px 18px;text-align:center;color:var(--danger)}
  /* 屏 S4 本人确认绑定:只对未绑定顾客显示的签字前置卡 */
  .claim{background:#fff;border-radius:16px;padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 14px rgba(45,40,38,.06)}
  .claim h2{font-size:19px;font-weight:800;color:var(--ink);margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .claim .badge{font-size:11px;font-weight:700;background:#fdecec;color:var(--danger);border-radius:8px;padding:2px 8px}
  .claim p{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 14px}
  .claim button.main{width:100%;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:15.5px;font-weight:800;padding:14px;cursor:pointer}
  .claim .alt{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7;text-align:center}
  .claim .alt a{color:var(--bronze)}
  .claim .phone-auth{margin-top:10px;text-align:center}
  .claim .phone-auth button{border:1px solid var(--line);background:var(--paper);color:var(--bronze);border-radius:10px;padding:9px 16px;font-size:12.5px;cursor:pointer}
  .claim .note{margin-top:10px;font-size:12px;border-radius:10px;padding:9px 11px;line-height:1.6}
  .claim .note.ok{background:#e7f0ea;color:var(--ok)}
  .claim .note.warn{background:#fdf3ec;color:#a8551f}
  .locked{opacity:.45;pointer-events:none}
  /* 屏 C2 优惠券:签字前可选/更换,签后整页锁定。无可用券时整行不渲染(不占位)。 */
  .cpn-card{background:#fff;border-radius:14px;padding:12px 14px;margin-top:12px;box-shadow:0 2px 14px rgba(45,40,38,.06);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cpn-card .lab{font-size:13px;color:var(--muted)}
  .cpn-card .tag{display:inline-block;font-size:11px;background:#e7f0ea;color:var(--ok);border-radius:8px;padding:1px 7px;margin-left:6px;font-weight:700}
  .cpn-card .val{font-weight:700;color:var(--ok);font-size:14px}
  .cpn-card .val.none{color:var(--muted);font-weight:500}
  .cpn-card .arr{color:#c8c0b2;font-size:13px;margin-left:6px}
  .cpn-mask{position:fixed;inset:0;background:rgba(35,30,28,.42);z-index:120;display:flex;align-items:flex-end}
  .cpn-sheet{width:100%;max-width:460px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
  .cpn-sheet h3{font-size:14px;margin-bottom:10px}
  .cpn-opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer}
  .cpn-opt.on{border-color:var(--ok);background:#eef5f1}
  .cpn-opt.dis{opacity:.55;cursor:not-allowed}
  .cpn-opt .l{flex:1}
  .cpn-opt .n{font-size:13.5px;font-weight:700}
  .cpn-opt .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .cpn-opt.dis .s{color:var(--danger)}
  .cpn-opt .d{font-weight:800;color:var(--ok);font-size:13.5px}
  .cpn-sheet .close{width:100%;border:none;border-radius:12px;background:var(--ink);color:#fff;font-size:15px;font-weight:800;padding:12px;margin-top:4px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="err" id="boot">加载中…</div></div>
<div class="cta" id="cta" style="display:none">
  <div class="inner">
    <div class="need" id="signTip" style="display:none"></div>
    <button id="signBtn">确认签字</button>
    <div class="foot" id="ctaFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 金额一律取后端返回值。这里只有一个 money() 负责「分 → 显示」,没有任何业务计算。
// 金额格式由后端下发的 currencyDisplay 决定(CNY→¥358,CAD→CAD $50.00),前端不做任何换算
const CUR = { v: '', fmt: { prefix: '<CODE> ', symbol: '$', trimZeroDecimals: false } }
function money(cents) {
  let text = (Math.round(cents) / 100).toFixed(2)
  if (CUR.fmt.trimZeroDecimals) text = text.replace(/\.00$/, '')
  return `${String(CUR.fmt.prefix).replace('<CODE>', CUR.v)}${CUR.fmt.symbol}${text}`
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600) }

/* 进这一页有两个门(规则⑧ 双入口等效):
     ① 顾客在自己小程序里点通知 → /sign?code=XXX
     ② 店员出示二维码,顾客扫码 → /sign?t=<一次性签署码>(签署码指向具体一张单)
   两个门打开的是同一张签署页、同一张单;先签为准。 */
const qs = new URLSearchParams(location.search)
const signToken = qs.get('t') || ''
let code = decodeURIComponent(location.pathname.replace(/^\/sign\/?/, '') || qs.get('code') || '')
let data = null
let claimDone = false      // 屏 S4:本人确认绑定完成没有
let authPhone = ''         // 可选手机号授权拿到的号(只做一致性校验,不改档案)
let hasInk = false
let strokes = []   // 笔迹点阵,按签名板坐标系;签署时随请求提交,由服务端渲进快照 SVG

async function load() {
  if (!code && signToken) {
    // 扫码进来:凭一次性签署码换单号;换到的同时后端会把状态行推成「顾客核对中」
    const r = await fetch(`/settlements/by-token/${encodeURIComponent(signToken)}`)
    const b = await r.json()
    if (!r.ok) { document.getElementById('boot').textContent = b?.error?.message || '这个签署码无效'; return }
    code = b.code
  }
  if (!code) { document.getElementById('boot').textContent = '缺少服务单号'; return }
  const res = await fetch(`/settlements/${encodeURIComponent(code)}`)
  const body = await res.json()
  if (!res.ok) { document.getElementById('boot').textContent = body?.error?.message || '找不到这张服务单'; return }
  data = body
  CUR.v = body.settlement.currency || ''
  if (body.settlement.currencyDisplay) CUR.fmt = body.settlement.currencyDisplay
  render()
}

/* 已签单右上角:显示**真实手写笔迹**(店主 2026-08-10 口径变更,原「存姓名文本」拍板作废)。
   笔迹本来就渲进签署快照了(全库 115 张已签单里 113 张有真迹),这里把快照当图片嵌进来 ——
   快照是签字那一刻的凭证、只追加不可改,所以显示的就是当时那一笔。
   早期 2 张只存了文本的历史单快照不可改,如实标「早期单 · 仅存文本」。 */
function signSlotHtml(s) {
  if (s.status !== 'signed') return '（签署后显示于此）'
  if (s.snapshot && s.snapshotHasInk) {
    return `<img class="ink" src="/settlements/${encodeURIComponent(s.code)}/signature.svg" alt="顾客签名" loading="lazy">`
  }
  return `${esc(s.signatureName || '（已签）')}<span class="ink-note">早期单 · 仅存文本</span>`
}

function render() {
  const s = data.settlement
  const signed = s.status === 'signed'
  const techLine = s.technicians.map((t) => `${esc(t.name)}（${t.role === 'main' ? '主' : '副'}）`).join(' · ')
  const techNos = s.technicians.map((t) => `${esc(t.name)}：${t.itemNos.join('·') || '—'}`).join(' ／ ')
  const payLabel = { deposit: '已付定金抵扣', stored_value: '储值卡抵扣', migrate_stored: '储值卡抵扣', offline: '到店支付', times_card: '次卡抵扣', coupon: '优惠券' }

  /* 屏 S4:只对**未绑定**顾客显示的签字前置卡(规则⑤)。
     绑定 = openid 绑到这张单挂着的档案 —— 单挂谁,建单时就定死,与微信注册手机号无关。
     已绑定顾客直接看到账单,这张卡整块不渲染。 */
  const needClaim = !signed && s.customerBound === false && !claimDone
  document.getElementById('wrap').innerHTML = `
    <div class="topbar">
      <h1>服务确认单</h1>
      <span class="pill ${signed ? '' : 'warn'}">${signed ? '已签署' : `待签 ${s.groupIndex || 1}/${s.groupTotal || 1}`}</span>
    </div>
    ${needClaim ? `
    <div class="claim">
      <h2>你是${esc(s.cardOwnerName || '本人')}吗？<span class="badge">${esc(s.bindBadgeText || '未绑定')}</span></h2>
      <p>确认后本次账单与电子票据自动存入你的小程序「我的 → 消费记录」，同时生成你的专属会员码。</p>
      <button class="main" id="claimBtn">是我本人，绑定并继续</button>
      <div class="phone-auth"><button id="phoneAuthBtn">可选：手机号一键授权校验</button></div>
      <div id="claimNote"></div>
      <div class="alt">不是本人（代付/代签不适用，须本人签字）→ 店员设备当面手签</div>
    </div>` : ''}
    <div class="doc">
      <div class="sign-slot">
        <div class="lab">顾客签名：</div>
        <div class="val ${s.signatureName ? '' : 'empty'}" id="signSlot">${signSlotHtml(s)}</div>
      </div>
      <div class="doc-head">
        <div class="store">${esc(s.storeName)}</div>
        <div class="meta">订单编号 ${esc(s.code)}</div>
        <div class="meta">${s.appointmentAt ? esc(String(s.appointmentAt).slice(0, 16).replace('T', ' ')) : ''}${s.servedPersonName ? ` · 被服务者：${esc(s.servedPersonName)}` : ''}</div>
      </div>

      <div class="sec">
        <h2>服务技师</h2>
        <div>${techLine || '—'}</div>
        <div class="meta">${techNos}</div>
      </div>

      <div class="sec">
        <h2>服务明细</h2>
        ${s.isProxyPaid ? `<div class="proxy-line">本单由 ${esc(s.cardOwnerName || '卡主')} 的卡支付（代付）</div>` : ''}
        ${s.items.map((i) => `
          <div class="row">
            <span><span class="no">${String(i.itemNo).padStart(2, '0')}</span>${esc(i.name)}${i.unit === 'per_finger' ? ` ×${i.qty} 指` : (i.qty > 1 ? ` ×${i.qty}` : '')}</span>
            <span class="amt">${i.isFree
              ? '<span class="free">免收</span>'
              : `${i.listAmountCents !== i.amountCents ? `<span class="strike">${money(i.listAmountCents)}</span>` : ''}${money(i.amountCents)}`}</span>
          </div>`).join('')}
      </div>

      <div class="sec">
        <h2>支付构成</h2>
        ${s.payments.map((p) => `
          <div class="row">
            <span>${esc(payLabel[p.leg] || p.leg)}${p.leg === 'migrate_stored' ? '<span class="badge">历史余额</span>' : ''}</span>
            <span class="amt">${p.leg === 'deposit' ? `−${money(p.amountCents)}` : money(p.amountCents)}</span>
          </div>`).join('') || '<div class="meta">—</div>'}
      </div>

      <div class="totals">
        <div class="row"><span>原价合计</span><span class="strike">${money(s.listTotalCents)}</span></div>
        <div class="row"><span>${s.couponDiscountCents ? '共优惠（含券）' : '较原价共优惠'}</span><b>${money(s.discountTotalCents)}</b></div>
        ${s.couponDiscountCents ? `<div class="row"><span>优惠券 ${esc(s.coupon ? s.coupon.name : '')}</span><b>−${money(s.couponDiscountCents)}</b></div>` : ''}
        <div class="row grand"><span>合计</span><span>${money(s.totalCents)}</span></div>
      </div>
    </div>
    ${couponCardHtml()}

    ${signed ? `<div class="done">✓ 本单已于 ${esc(String(s.signedAt).slice(0, 16).replace('T', ' '))} 签署完成${s.snapshot ? `<div style="margin-top:10px;font-weight:500"><a href="/settlements/${encodeURIComponent(s.code)}/snapshot" target="_blank">查看签署单</a></div>` : ''}</div>` : `
    <label class="disc">
      <input type="checkbox" id="disc">
      <span>${esc(data.disclaimer)}</span>
    </label>
    <div class="pad">
      <canvas id="pad"></canvas>
      <div class="hint"><span>请在框内签名</span><button type="button" id="clearPad">重签</button></div>
    </div>`}
  `
  document.getElementById('cta').style.display = signed ? 'none' : ''
  const storedLeg = s.payments.filter((p) => p.leg === 'stored_value' || p.leg === 'migrate_stored').reduce((n, p) => n + p.amountCents, 0)
  document.getElementById('ctaFoot').innerHTML = storedLeg
    ? `签署后储值卡将即时扣除 ${money(storedLeg)} · 有问题？<a href="#" id="afterSales">联系客服</a>`
    : '有问题？<a href="#" id="afterSales">联系客服</a>'
  if (!signed) initPad()
  const opener = document.getElementById('cpnOpen')
  if (opener) opener.addEventListener('click', openCouponSheet)
  /* 屏 S4:没确认本人之前,账单以下整块置灰不可点、CTA 也锁住 ——
     绑定是签字的前置步骤,不是可跳过的提示条。 */
  /* 🔴 2026-08-09 店主实测:固定底栏把签名板下面的「请在框内签名 / 重签」整行压住了。
     原来 #wrap 写死 padding-bottom:120px,而底栏高度是变的(脚注一行还是两行、
     iPhone 安全区高度都不一样),写死的值不够就穿帮。改成按底栏**实际高度**留白。 */
  const fitBottom = () => {
    const bar = document.getElementById('cta')
    const wrap = document.getElementById('wrap')
    if (!bar || !wrap) return
    wrap.style.paddingBottom = `${(bar.getBoundingClientRect().height || 100) + 28}px`
  }
  fitBottom()
  requestAnimationFrame(fitBottom)          // 字体加载完高度会变,再量一次
  window.addEventListener('resize', fitBottom)

  const claimBtn = document.getElementById('claimBtn')
  if (claimBtn) {
    claimBtn.addEventListener('click', doClaim)
    const phoneBtn = document.getElementById('phoneAuthBtn')
    if (phoneBtn) phoneBtn.addEventListener('click', askPhoneAuth)
    document.querySelector('.doc').classList.add('locked')
    const disc = document.getElementById('disc'); if (disc) disc.disabled = true
    const btn = document.getElementById('signBtn'); if (btn) btn.disabled = true
    document.getElementById('cta').classList.add('locked')
  }
}

/* 券区(屏 C2)。签字前可点开更换/取消,签后整块不再出现 —— 顾客签的就是用完券的最终构成。
   规则⑥:一张可用券都没有、也没选过券时,顾客端整行不显示,不占位。 */
function couponCardHtml() {
  const s = data.settlement
  if (s.status === 'signed') return ''
  const pack = data.coupons || { options: [], usableCount: 0 }
  const picked = s.coupon
  if (!picked && !pack.usableCount) return ''
  const byStaff = picked && picked.selectedBy === 'staff'
  return `
    <div class="cpn-card" id="cpnOpen">
      <span class="lab">优惠券${byStaff ? '<span class="tag">店员已为你选用</span>' : ''}</span>
      <span>
        ${picked
          ? `<b class="val">${esc(picked.name)} −${money(picked.discountCents)}</b><span class="arr">更换›</span>`
          : `<b class="val none">${pack.usableCount} 张可用</b><span class="arr">去选择›</span>`}
      </span>
    </div>`
}

function openCouponSheet() {
  const pack = data.coupons || { options: [] }
  const picked = data.settlement.coupon
  const box = document.createElement('div')
  box.className = 'cpn-mask'
  box.innerHTML = `
    <div class="cpn-sheet" id="cpnSheet">
      <h3>选择优惠券</h3>
      ${pack.options.map((o) => `
        <div class="cpn-opt ${o.usable ? '' : 'dis'} ${picked && picked.grantId === o.grantId ? 'on' : ''}" data-grant="${o.usable ? esc(o.grantId) : ''}">
          <span class="l"><span class="n">${esc(o.name)}</span><span class="s">${esc(o.usable ? o.subtitle : o.reason)}</span></span>
          ${o.usable ? `<span class="d">−${money(o.discountCents)}</span>` : ''}
        </div>`).join('')}
      <div class="cpn-opt ${picked ? '' : 'on'}" data-grant=""><span class="l"><span class="n">不使用优惠券</span><span class="s">本单不抵扣</span></span></div>
      <button class="close" id="cpnClose">取消</button>
    </div>`
  document.body.appendChild(box)
  const close = () => box.remove()
  box.addEventListener('click', (e) => { if (e.target === box) close() })
  box.querySelector('#cpnClose').addEventListener('click', close)
  box.querySelectorAll('.cpn-opt').forEach((el) => {
    el.addEventListener('click', async () => {
      if (el.classList.contains('dis')) return
      close()
      await applyCoupon(el.dataset.grant || '')
    })
  })
}

// 改券后全部金额由后端重算刷新 —— 本页一处加减都没有
async function applyCoupon(grantId) {
  try {
    const res = await fetch(`/settlements/${encodeURIComponent(code)}/coupon`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ grantId })
    })
    const body = await res.json()
    if (!res.ok) throw new Error(body?.error?.message || '改券失败')
    await load()
    toast(grantId ? '已使用优惠券,金额已更新' : '已取消用券,金额已更新')
  } catch (error) {
    toast(error.message)
  }
}

function initPad() {
  const canvas = document.getElementById('pad')
  const ratio = window.devicePixelRatio || 1
  canvas.width = canvas.offsetWidth * ratio
  canvas.height = canvas.offsetHeight * ratio
  const ctx = canvas.getContext('2d')
  ctx.scale(ratio, ratio)
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2d2826'
  let drawing = false
  const pos = (e) => {
    const r = canvas.getBoundingClientRect()
    const p = e.touches ? e.touches[0] : e
    return { x: p.clientX - r.left, y: p.clientY - r.top }
  }
  const start = (e) => { e.preventDefault(); drawing = true; hasInk = true; const { x, y } = pos(e); ctx.beginPath(); ctx.moveTo(x, y); strokes.push([{ x: Math.round(x), y: Math.round(y) }]); sync() }
  const move = (e) => { if (!drawing) return; e.preventDefault(); const { x, y } = pos(e); ctx.lineTo(x, y); ctx.stroke(); const cur = strokes[strokes.length - 1]; if (cur) cur.push({ x: Math.round(x), y: Math.round(y) }) }
  const end = () => { drawing = false }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end)
  canvas.addEventListener('touchstart', start, { passive: false }); canvas.addEventListener('touchmove', move, { passive: false }); canvas.addEventListener('touchend', end)
  document.getElementById('clearPad').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; strokes = []; sync()
  })
  document.getElementById('disc').addEventListener('change', sync)
  sync()
}

/* 必勾免责 + 必须有签名笔迹。
   🔴 2026-08-09 店主实测:原来两者没齐就把按钮**灰掉**,页面不说缺什么 ——
   顾客当面签字时店员只看到"点不动",不知道差哪一步。
   改成:按钮**始终可点**,点下去告诉她缺什么并滚到那一项;
   同时底栏上方常驻一行提示,不用点也知道还差什么。 */
function missingStep() {
  const disc = document.getElementById('disc')
  if (!disc || !disc.checked) return { key: 'disc', text: '还差一步:请勾选上方的确认声明' }
  if (!hasInk) return { key: 'ink', text: '还差一步:请在签名框里手写签名' }
  return null
}
function sync() {
  const btn = document.getElementById('signBtn')
  const tip = document.getElementById('signTip')
  if (!btn) return
  const miss = missingStep()
  btn.disabled = false                       // 不再死灰:点得动,点了才知道缺什么
  btn.classList.toggle('waiting', Boolean(miss))
  if (tip) {
    tip.textContent = miss ? miss.text : ''
    tip.style.display = miss ? 'block' : 'none'
  }
}

/* 屏 S4 接线:一次点击完成绑定(规则⑤)。
   冲突(该微信已绑本店另一档案)不覆盖、不拦签字,只提示并进人工合并队列。 */
async function doClaim() {
  const btn = document.getElementById('claimBtn')
  if (!btn) return
  btn.disabled = true; btn.textContent = '绑定中…'
  try {
    const res = await fetch(`/settlements/${encodeURIComponent(code)}/claim`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(authPhone ? { phone: authPhone } : {})
    })
    const body = await res.json()
    if (!res.ok) throw new Error(body?.error?.message || '绑定失败')
    claimDone = true
    await load()                       // 重新拉:绑定后徽标消失、前置卡收起
    toast(body.note || '已绑定')
  } catch (e) {
    btn.disabled = false; btn.textContent = '是我本人，绑定并继续'
    toast(e.message || '绑定失败，请让店员帮忙')
  }
}

/* 可选的手机号一键授权:**只做一致性校验** —— 不一致仅提示,不拦签字、不改档案(S4-06)。
   沙盒里没有真微信授权,让顾客手填一次即可走通演示。 */
function askPhoneAuth() {
  const v = window.prompt('手机号一键授权（仅用于与档案核对，不会修改你的档案）', '')
  if (v === null) return
  authPhone = String(v).replace(/\D/g, '')
  const box = document.getElementById('claimNote')
  if (!box) return
  if (!authPhone) { box.innerHTML = ''; return }
  box.innerHTML = `<div class="note ok">已记下 ${esc(authPhone)}，点「是我本人」时一起核对。</div>`
}

document.getElementById('signBtn').addEventListener('click', async () => {
  const btn = document.getElementById('signBtn')
  const miss = missingStep()
  if (miss) {
    toast(miss.text)
    const el = document.getElementById(miss.key === 'disc' ? 'disc' : 'pad')
    if (el) {
      const box = miss.key === 'disc' ? el.closest('.disc') : el
      if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' })
      if (miss.key === 'disc') { box.classList.add('flash'); setTimeout(() => box.classList.remove('flash'), 1200) }
    }
    return
  }
  btn.disabled = true; btn.textContent = '提交中…'
  try {
    const res = await fetch(`/settlements/${encodeURIComponent(code)}/sign`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        disclaimerAccepted: document.getElementById('disc').checked,
        // 笔迹点阵交给服务端渲进快照 SVG(唯一凭证);姓名文本继续保留供检索
        strokes,
        signature: data.settlement.servedPersonName || '顾客本人',
        signedBy: data.settlement.servedPersonName || ''
      })
    })
    const body = await res.json()
    if (!res.ok) throw new Error(body?.error?.message || '签署失败')
    toast(body.storedDeductedCents ? `已签署,储值卡扣除 ${money(body.storedDeductedCents)}` : '已签署')
    await load()
  } catch (error) {
    toast(error.message)
    btn.disabled = false; btn.textContent = '确认签字'
  }
})

load()
</script>
